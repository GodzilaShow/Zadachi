<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F2F2F7">
<title>Задачи</title>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F7F7FA; --text:#1C1C1E; --sub:#8E8E93; --line:rgba(60,60,67,.12);
  --accent:#5E5CE6; --accent2:#8B7CF6; --red:#FF3B30; --green:#34C759; --orange:#FF9F0A;
  --glass:rgba(255,255,255,.72); --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(30,30,80,.06);
  --spring:cubic-bezier(.2,.9,.25,1.15); --ease:cubic-bezier(.32,.72,0,1);
}
[data-theme=dark]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --text:#F2F2F7; --sub:#8E8E93; --line:rgba(84,84,88,.4);
  --accent:#7D7AFF; --accent2:#A99BFF; --glass:rgba(28,28,30,.72); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,"SF Pro Text","Inter",Roboto,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;transition:background .4s var(--ease),color .4s}
body{min-height:100vh;padding-bottom:120px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
svg{display:block}

/* background blobs */
.blobs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blob{position:absolute;width:340px;height:340px;border-radius:50%;filter:blur(70px);opacity:.35;animation:float 18s ease-in-out infinite}
.blob.a{background:#8B7CF6;top:-120px;left:-100px}
.blob.b{background:#5AC8FA;top:-60px;right:-140px;animation-delay:-6s;opacity:.25}
[data-theme=dark] .blob{opacity:.18}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,40px) scale(1.1)}}

.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 18px 0}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;animation:fadeUp .7s var(--ease) both}
.hello{font-size:15px;color:var(--sub);font-weight:500}
.title{font-size:34px;font-weight:800;letter-spacing:-.8px;line-height:1.1;margin-top:2px}
.date{font-size:15px;color:var(--sub);margin-top:4px;text-transform:capitalize}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:url(#grad);stroke-linecap:round;transition:stroke-dashoffset 1s var(--spring)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:700}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);transition:transform .3s var(--spring)}
.iconbtn:active{transform:scale(.88)}
.iconbtn svg{width:19px;height:19px;stroke:var(--text)}
.topright{display:flex;flex-direction:column;align-items:center;gap:10px}

/* search */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);margin-bottom:14px;animation:fadeUp .7s .05s var(--ease) both}
.search svg{width:17px;height:17px;stroke:var(--sub);flex:none}
.search input{flex:1;font-size:16px}
.search input::placeholder{color:var(--sub)}

/* segmented */
.seg{position:relative;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card2);border-radius:12px;padding:3px;margin-bottom:14px;animation:fadeUp .7s .1s var(--ease) both}
[data-theme=light] .seg,:root:not([data-theme=dark]) .seg{background:rgba(118,118,128,.12)}
.seg button{position:relative;z-index:1;padding:8px 0;font-size:14px;font-weight:600;color:var(--sub);transition:color .3s}
.seg button.on{color:var(--text)}
.seg .pill{position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);transition:transform .45s var(--spring),width .45s var(--spring)}
.seg .cnt{font-size:11px;opacity:.7;margin-left:3px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 8px;padding:2px 18px 10px;animation:fadeUp .7s .15s var(--ease) both}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;transition:all .35s var(--spring)}
.chip:active{transform:scale(.92)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.on{background:var(--c);color:#fff;box-shadow:0 6px 16px -4px var(--c)}
.chip.on i{background:#fff}

/* groups & cards */
.group{margin-top:14px}
.ghead{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--sub);padding:0 6px 8px}
.ghead.red{color:var(--red)}
.item{position:relative;margin-bottom:10px;border-radius:20px;overflow:hidden;transition:height .4s var(--ease),margin .4s var(--ease),opacity .3s}
.item.enter{animation:pop .6s var(--spring) both;animation-delay:calc(var(--i)*45ms)}
.under{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-radius:20px}
.under svg{width:26px;height:26px;stroke:#fff;stroke-width:2.4;transition:transform .3s var(--spring)}
.under .l,.under .r{opacity:0;transition:opacity .2s}
.card{position:relative;display:flex;gap:12px;padding:15px 16px 15px 14px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);touch-action:pan-y;will-change:transform;transition:transform .45s var(--spring),background .3s}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--c);opacity:.9}
.card.pressed{transform:scale(.98)}
.check{flex:none;width:26px;height:26px;margin-top:1px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;transition:all .35s var(--spring);position:relative}
.check svg{width:14px;height:14px;stroke:#fff;stroke-width:3.2;fill:none;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .1s var(--ease)}
.check.on{background:var(--c);transform:scale(1.08)}
.check.on svg{stroke-dashoffset:0}
.check:active{transform:scale(.82)}
.body{flex:1;min-width:0}
.ttl{font-size:16.5px;font-weight:600;line-height:1.3;word-wrap:break-word;transition:color .3s}
.done .ttl{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--sub)}
.note{font-size:14px;color:var(--sub);line-height:1.4;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--card2);color:var(--sub)}
.tag svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.2;fill:none}
.tag.red{background:rgba(255,59,48,.12);color:var(--red)}
.tag.today{background:rgba(94,92,230,.12);color:var(--accent)}
.tag.prio{background:rgba(255,159,10,.14);color:var(--orange)}
.tag.prio.hi{background:rgba(255,59,48,.12);color:var(--red)}
.bar{height:4px;width:46px;border-radius:4px;background:var(--line);overflow:hidden;align-self:center}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px;transition:width .5s var(--spring)}

/* empty */
.empty{text-align:center;padding:60px 20px 20px;animation:fadeUp .6s var(--ease) both}
.empty svg{width:150px;height:150px;margin:0 auto 14px;animation:bob 4s ease-in-out infinite}
.empty h3{font-size:20px;font-weight:700}
.empty p{color:var(--sub);margin-top:6px;font-size:15px}
@keyframes bob{50%{transform:translateY(-10px) rotate(-2deg)}}

/* fab */
.fab{position:fixed;right:22px;bottom:calc(env(safe-area-inset-bottom) + 26px);z-index:20;width:62px;height:62px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 12px 28px -6px rgba(94,92,230,.6),inset 0 1px 0 rgba(255,255,255,.3);
  display:grid;place-items:center;transition:transform .45s var(--spring);animation:fabIn .8s .3s var(--spring) both}
.fab svg{width:28px;height:28px;stroke:#fff;stroke-width:2.6;transition:transform .45s var(--spring)}
.fab:active{transform:scale(.86)}
.fab.open svg{transform:rotate(135deg)}
@keyframes fabIn{from{transform:scale(0) rotate(-90deg)}}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;margin:0 auto;max-height:92vh;overflow-y:auto;background:var(--bg);
  border-radius:28px 28px 0 0;padding:8px 18px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .55s var(--spring);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.show{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.shead button.txt{color:var(--accent);font-size:16px;font-weight:500;padding:6px 2px}
.shead h4{font-size:17px;font-weight:700}
.box{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.box .big{width:100%;font-size:20px;font-weight:600}
.box .big::placeholder,.box textarea::placeholder,.sub input::placeholder{color:var(--sub);font-weight:500}
.box textarea{width:100%;resize:none;font-size:15px;line-height:1.45;margin-top:10px;min-height:44px;color:var(--text)}
.lbl{font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin:0 0 10px 2px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:6px;padding:9px 13px;border-radius:12px;background:var(--card2);font-size:14px;font-weight:600;transition:all .3s var(--spring);position:relative}
.opt:active{transform:scale(.92)}
.opt.on{background:var(--c,var(--accent));color:#fff;box-shadow:0 6px 14px -5px var(--c,var(--accent))}
.opt i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.opt.on i{background:#fff}
.opt input{position:absolute;inset:0;opacity:0;width:100%}
.row2{display:flex;gap:8px;margin-top:10px}
.sub{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);animation:fadeUp .35s var(--ease) both}
.sub:last-of-type{border-bottom:0}
.sub .sc{width:22px;height:22px;border-radius:50%;border:2px solid var(--accent);flex:none;display:grid;place-items:center;transition:all .3s var(--spring)}
.sub .sc svg{width:11px;height:11px;stroke:#fff;stroke-width:3.5;fill:none;opacity:0}
.sub .sc.on{background:var(--accent)}
.sub .sc.on svg{opacity:1}
.sub input{flex:1;font-size:15px}
.sub .x{color:var(--sub);font-size:20px;line-height:1;padding:0 4px}
.addsub{color:var(--accent);font-weight:600;font-size:15px;padding:8px 0 2px;display:flex;align-items:center;gap:8px}
.save{width:100%;padding:16px;border-radius:16px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent2),var(--accent));
  box-shadow:0 10px 24px -8px rgba(94,92,230,.7);transition:transform .3s var(--spring),opacity .3s;margin-top:4px}
.save:active{transform:scale(.96)}
.save:disabled{opacity:.45}
.del{width:100%;padding:14px;margin-top:10px;border-radius:16px;color:var(--red);font-weight:600;background:var(--card)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 104px);z-index:40;transform:translate(-50%,30px) scale(.9);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:14px;padding:12px 14px 12px 18px;border-radius:16px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);
  box-shadow:0 10px 30px rgba(0,0,0,.18);font-size:15px;font-weight:500;transition:all .45s var(--spring);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.toast button{color:var(--accent);font-weight:700}

.particle{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:50}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A99BFF"/><stop offset="1" stop-color="#5E5CE6"/></linearGradient></defs></svg>
<div class="blobs"><div class="blob a"></div><div class="blob b"></div></div>

<div class="wrap">
  <header class="top">
    <div>
      <div class="hello" id="hello"></div>
      <div class="title">Задачи</div>
      <div class="date" id="today"></div>
    </div>
    <div class="topright">
      <div class="ring" id="ring">
        <svg width="64" height="64"><circle class="bgc" cx="32" cy="32" r="27" fill="none" stroke-width="7"/><circle class="fg" id="ringfg" cx="32" cy="32" r="27" fill="none" stroke-width="7" stroke-dasharray="169.6" stroke-dashoffset="169.6"/></svg>
        <b id="ringtxt">0/0</b>
      </div>
    </div>
  </header>

  <div style="display:flex;gap:10px;align-items:center">
    <label class="search" style="flex:1"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Поиск" autocomplete="off"></label>
    <button class="iconbtn" id="theme" style="margin-bottom:14px" aria-label="Тема"></button>
  </div>

  <nav class="seg" id="seg">
    <div class="pill" id="pill"></div>
    <button data-t="today">Сегодня</button>
    <button data-t="soon">Скоро</button>
    <button data-t="all">Все</button>
    <button data-t="done">Готово</button>
  </nav>

  <div class="chips" id="chips"></div>
  <main id="list"></main>
</div>

<button class="fab" id="fab" aria-label="Новая задача"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="backdrop" id="backdrop"></div>
<section class="sheet" id="sheet">
  <div class="grab" id="grab"></div>
  <div class="shead"><button class="txt" id="cancel">Отмена</button><h4 id="shtitle">Новая задача</h4><span style="width:58px"></span></div>
  <div class="box">
    <input class="big" id="f-title" placeholder="Что нужно сделать?" maxlength="200">
    <textarea id="f-note" placeholder="Заметка…" rows="2"></textarea>
  </div>
  <div class="box">
    <div class="lbl">Когда</div>
    <div class="opts" id="f-when"></div>
    <div class="row2"><label class="opt" id="timeopt"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="timetxt">Время</span><input type="time" id="f-time"></label></div>
  </div>
  <div class="box"><div class="lbl">Список</div><div class="opts" id="f-list"></div></div>
  <div class="box"><div class="lbl">Приоритет</div><div class="opts" id="f-prio"></div></div>
  <div class="box"><div class="lbl">Подзадачи</div><div id="f-subs"></div><button class="addsub" id="addsub"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Добавить пункт</button></div>
  <button class="save" id="save">Сохранить</button>
  <button class="del" id="del">Удалить задачу</button>
</section>

<div class="toast" id="toast"><span id="toasttxt"></span><button id="undo">Отменить</button></div>

<script>
const LISTS=[
  {id:'work',name:'Работа',c:'#0A84FF'},
  {id:'me',name:'Личное',c:'#FF9F0A'},
  {id:'study',name:'Учёба',c:'#BF5AF2'},
  {id:'shop',name:'Покупки',c:'#30D158'},
  {id:'idea',name:'Идеи',c:'#FF375F'}
];
const LC=id=>(LISTS.find(l=>l.id===id)||LISTS[1]).c;
const $=s=>document.querySelector(s);
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const TODAY=()=>ymd(new Date());
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

let S={tasks:[],tab:'today',list:'all',q:'',theme:null};
function load(){
  try{const r=JSON.parse(localStorage.getItem('zadachi.v1'));if(r&&r.tasks){S.tasks=r.tasks;S.theme=r.theme||null;return}}catch(e){}
  S.tasks=[
    {id:uid(),title:'Добро пожаловать 👋',note:'Свайп вправо — готово.\nСвайп влево — удалить.\nНажми на карточку, чтобы изменить.',list:'me',due:TODAY(),time:'',prio:0,subs:[],done:false,created:Date.now()},
    {id:uid(),title:'Купить продукты',note:'',list:'shop',due:TODAY(),time:'18:00',prio:0,subs:[{t:'Молоко',d:true},{t:'Хлеб',d:false},{t:'Сыр',d:false}],done:false,created:Date.now()},
    {id:uid(),title:'Подготовить презентацию',note:'Для встречи с командой',list:'work',due:addDays(1),time:'10:00',prio:2,subs:[],done:false,created:Date.now()}
  ];
}
function save(){try{localStorage.setItem('zadachi.v1',JSON.stringify({tasks:S.tasks,theme:S.theme}))}catch(e){}}

/* theme */
const sun='<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const moon='<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function applyTheme(){
  const sys=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  const t=S.theme||sys;document.documentElement.dataset.theme=t;
  $('#theme').innerHTML=t==='dark'?sun:moon;
  document.querySelector('meta[name=theme-color]').content=t==='dark'?'#000000':'#F2F2F7';
  try{window.Android&&Android.setDark(t==='dark')}catch(e){}
}
$('#theme').onclick=()=>{S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme();save();buzz(8)};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);

/* header */
function header(){
  const h=new Date().getHours();
  $('#hello').textContent=h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер';
  $('#today').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  const t=TODAY();
  const tt=S.tasks.filter(x=>x.due===t||(x.done&&x.doneAt===t)||(!x.done&&x.due&&x.due<t));
  const d=tt.filter(x=>x.done).length, n=tt.length;
  $('#ringtxt').textContent=d+'/'+n;
  $('#ringfg').style.strokeDashoffset=169.6*(1-(n?d/n:0));
}

/* segmented */
function segUI(){
  const btns=[...document.querySelectorAll('#seg button')];
  const t=TODAY();
  const counts={today:S.tasks.filter(x=>!x.done&&x.due&&x.due<=t).length,soon:S.tasks.filter(x=>!x.done&&x.due>t).length,all:S.tasks.filter(x=>!x.done).length,done:0};
  btns.forEach(b=>{b.classList.toggle('on',b.dataset.t===S.tab);const c=counts[b.dataset.t];b.dataset.n=b.dataset.n||b.textContent.trim();b.innerHTML=b.dataset.n+(c?'<span class="cnt">'+c+'</span>':'')});
  const on=btns.find(b=>b.dataset.t===S.tab);
  const pill=$('#pill');pill.style.width=on.offsetWidth+'px';pill.style.transform='translateX('+(on.offsetLeft-3)+'px)';
}
$('#seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.t===S.tab)return;S.tab=b.dataset.t;buzz(6);render(true)});

/* chips */
function chips(){
  const all=[{id:'all',name:'Все списки',c:'#5E5CE6'},...LISTS];
  $('#chips').innerHTML=all.map(l=>`<button class="chip ${S.list===l.id?'on':''}" data-l="${l.id}" style="--c:${l.c}"><i></i>${l.name}</button>`).join('');
}
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;S.list=b.dataset.l;buzz(6);chips();render(true)});
$('#q').addEventListener('input',e=>{S.q=e.target.value.trim().toLowerCase();render(true)});

/* date helpers */
function dueLabel(x){
  if(!x.due)return null;const t=TODAY();
  let txt;
  if(x.due===t)txt='Сегодня';else if(x.due===addDays(1))txt='Завтра';else if(x.due===addDays(-1))txt='Вчера';
  else{const [y,m,d]=x.due.split('-').map(Number);txt=new Date(y,m-1,d).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}).replace('.','')}
  if(x.time)txt+=', '+x.time;
  const cls=!x.done&&x.due<t?'red':x.due===t?'today':'';
  return {txt,cls};
}

/* render */
let shown=new Set();
const ICO={
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  flag:'<svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  list:'<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>'
};
function filtered(){
  const t=TODAY();
  let a=S.tasks.filter(x=>{
    if(S.list!=='all'&&x.list!==S.list)return false;
    if(S.q&&!(x.title+' '+x.note+' '+x.subs.map(s=>s.t).join(' ')).toLowerCase().includes(S.q))return false;
    if(S.tab==='today')return !x.done&&x.due&&x.due<=t;
    if(S.tab==='soon')return !x.done&&x.due>t;
    if(S.tab==='all')return !x.done;
    return x.done;
  });
  const key=x=>(x.due||'9999')+(x.time||'99:99');
  if(S.tab==='done')a.sort((p,q)=>(q.doneTs||0)-(p.doneTs||0));
  else a.sort((p,q)=>key(p)<key(q)?-1:key(p)>key(q)?1:(q.prio-p.prio));
  return a;
}
function groups(a){
  const t=TODAY(),tm=addDays(1),g=[];
  const push=(name,items,red)=>items.length&&g.push({name,items,red});
  if(S.tab==='done'){push('Выполнено',a);return g}
  push('Просрочено',a.filter(x=>x.due&&x.due<t),true);
  push('Сегодня',a.filter(x=>x.due===t));
  push('Завтра',a.filter(x=>x.due===tm));
  push('Позже',a.filter(x=>x.due>tm));
  push('Без даты',a.filter(x=>!x.due));
  return g;
}
function cardHTML(x,i,anim){
  const c=LC(x.list),dl=dueLabel(x),ds=x.subs.filter(s=>s.d).length;
  let meta='';
  if(dl)meta+=`<span class="tag ${dl.cls}">${ICO.cal}${dl.txt}</span>`;
  if(x.prio)meta+=`<span class="tag prio ${x.prio===2?'hi':''}">${ICO.flag}${x.prio===2?'Важно':'Средний'}</span>`;
  if(x.subs.length)meta+=`<span class="tag">${ICO.list}${ds}/${x.subs.length}</span><span class="bar"><i style="width:${ds/x.subs.length*100}%"></i></span>`;
  return `<div class="item ${anim?'enter':''}" data-id="${x.id}" style="--i:${i};--c:${c}">
    <div class="under"><span class="l">${x.done?ICO.undo:ICO.check}</span><span class="r">${ICO.trash}</span></div>
    <div class="card ${x.done?'done':''}">
      <button class="check ${x.done?'on':''}" aria-label="Готово"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <div class="body"><div class="ttl">${esc(x.title)}</div>${x.note?`<div class="note">${esc(x.note)}</div>`:''}${meta?`<div class="meta">${meta}</div>`:''}</div>
    </div></div>`;
}
const EMPTY={
  today:['Свободный день ✨','На сегодня задач нет. Нажми «+», чтобы добавить.'],
  soon:['Впереди пусто','Запланируй что-нибудь на потом.'],
  all:['Всё сделано!','Список задач пуст. Отличная работа.'],
  done:['Пока ничего','Выполненные задачи появятся здесь.']
};
function render(animateAll){
  header();segUI();
  const a=filtered(),g=groups(a);
  if(!a.length){
    const [h,p]=S.q?['Ничего не найдено','Попробуй другой запрос.']:EMPTY[S.tab];
    $('#list').innerHTML=`<div class="empty"><svg viewBox="0 0 160 160" fill="none"><defs><linearGradient id="eg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A99BFF"/><stop offset="1" stop-color="#5E5CE6"/></linearGradient></defs><circle cx="80" cy="80" r="64" fill="url(#eg)" opacity=".14"/><rect x="44" y="36" width="72" height="90" rx="14" fill="url(#eg)"/><rect x="56" y="56" width="48" height="7" rx="3.5" fill="#fff" opacity=".9"/><rect x="56" y="72" width="36" height="7" rx="3.5" fill="#fff" opacity=".6"/><rect x="56" y="88" width="42" height="7" rx="3.5" fill="#fff" opacity=".6"/><circle cx="114" cy="114" r="20" fill="#34C759"/><path d="M104 114l7 7 13-14" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><h3>${h}</h3><p>${p}</p></div>`;
    shown=new Set();return;
  }
  let i=0,html='';
  g.forEach(gr=>{
    html+=`<section class="group"><div class="ghead ${gr.red?'red':''}"><span>${gr.name}</span><span>${gr.items.length}</span></div>`;
    gr.items.forEach(x=>{html+=cardHTML(x,i,animateAll||!shown.has(x.id));i++});
    html+='</section>';
  });
  $('#list').innerHTML=html;
  shown=new Set(a.map(x=>x.id));
}

/* collapse animation */
function collapse(el,cb){
  el.style.height=el.offsetHeight+'px';
  requestAnimationFrame(()=>{el.style.height='0px';el.style.marginBottom='0px';el.style.opacity='0'});
  setTimeout(cb,380);
}

/* particles */
function burst(x,y,color){
  const cols=[color,'#FFD60A','#5E5CE6','#FF375F','#30D158'];
  for(let i=0;i<14;i++){
    const p=document.createElement('span');p.className='particle';p.style.left=x+'px';p.style.top=y+'px';p.style.background=cols[i%cols.length];
    const s=Math.random()*5+5;p.style.width=p.style.height=s+'px';
    document.body.appendChild(p);
    const ang=Math.PI*2*i/14+Math.random()*.4,dist=40+Math.random()*40;
    p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(ang)*dist}px),calc(-50% + ${Math.sin(ang)*dist}px)) scale(0)`,opacity:0}],{duration:650+Math.random()*250,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove();
  }
}

/* actions */
function toggleDone(id,checkEl){
  const x=S.tasks.find(t=>t.id===id);if(!x)return;
  const item=document.querySelector(`.item[data-id="${id}"]`);
  const willDone=!x.done;
  if(checkEl){
    checkEl.classList.toggle('on',willDone);item.querySelector('.card').classList.toggle('done',willDone);
    if(willDone){const r=checkEl.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,LC(x.list));buzz([10,30,15])}else buzz(8);
  }
  x.done=willDone;x.doneAt=willDone?TODAY():null;x.doneTs=willDone?Date.now():null;save();
  setTimeout(()=>{if(item&&item.isConnected)collapse(item,()=>render());else render()},checkEl?520:0);
  showToast(willDone?'Готово 🎉':'Возвращено в работу',()=>{x.done=!willDone;x.doneAt=x.done?TODAY():null;save();render()});
}
let lastDel=null;
function removeTask(id){
  const idx=S.tasks.findIndex(t=>t.id===id);if(idx<0)return;
  const [x]=S.tasks.splice(idx,1);save();buzz(15);
  const item=document.querySelector(`.item[data-id="${id}"]`);
  item?collapse(item,()=>render()):render();
  showToast('Задача удалена',()=>{S.tasks.splice(idx,0,x);save();render()});
}
let toastT,undoFn;
function showToast(txt,undo){
  clearTimeout(toastT);$('#toasttxt').textContent=txt;undoFn=undo;$('#toast').classList.add('show');
  toastT=setTimeout(()=>$('#toast').classList.remove('show'),3200);
}
$('#undo').onclick=()=>{$('#toast').classList.remove('show');if(undoFn){undoFn();undoFn=null;buzz(8)}};

/* list interactions: tap, check, swipe */
const list=$('#list');
list.addEventListener('click',e=>{
  const chk=e.target.closest('.check');const item=e.target.closest('.item');if(!item)return;
  if(chk){e.stopPropagation();toggleDone(item.dataset.id,chk);return}
});
let sw=null;
list.addEventListener('pointerdown',e=>{
  const card=e.target.closest('.card');if(!card||e.target.closest('.check'))return;
  sw={card,item:card.parentElement,x0:e.clientX,y0:e.clientY,dx:0,mode:null,id:card.parentElement.dataset.id,t:Date.now()};
  card.classList.add('pressed');
});
list.addEventListener('pointermove',e=>{
  if(!sw)return;const dx=e.clientX-sw.x0,dy=e.clientY-sw.y0;
  if(!sw.mode){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy))sw.mode='h';else if(Math.abs(dy)>8){sw.mode='v';sw.card.classList.remove('pressed')}}
  if(sw.mode!=='h')return;
  sw.card.classList.remove('pressed');sw.card.style.transition='none';
  const r=dx>0?dx:dx; const damp=Math.sign(r)*Math.min(Math.abs(r),Math.abs(r)*.6+50);
  sw.dx=dx;sw.card.style.transform=`translateX(${damp}px)`;
  const under=sw.item.querySelector('.under'),done=sw.item.querySelector('.card').classList.contains('done');
  const past=Math.abs(dx)>90;
  under.style.background=dx>0?(done?'#FF9F0A':'#34C759'):'#FF3B30';
  under.querySelector('.l').style.opacity=dx>0?1:0;under.querySelector('.r').style.opacity=dx<0?1:0;
  under.querySelectorAll('svg').forEach(s=>s.style.transform=past?'scale(1.25)':'scale(.9)');
  if(past&&!sw.hap){buzz(10);sw.hap=true}if(!past)sw.hap=false;
});
function endSwipe(e){
  if(!sw)return;const {card,item,dx,mode,id,t}=sw;sw=null;
  card.classList.remove('pressed');card.style.transition='';
  if(mode==='h'&&Math.abs(dx)>90){
    if(dx<0){card.style.transform='translateX(-110%)';setTimeout(()=>removeTask(id),180)}
    else{card.style.transform='translateX(0)';const chk=card.querySelector('.check');setTimeout(()=>toggleDone(id,chk),150)}
  }else{
    card.style.transform='';
    if(!mode&&e.type==='pointerup'&&Date.now()-t<500)openSheet(id);
  }
}
list.addEventListener('pointerup',endSwipe);list.addEventListener('pointercancel',endSwipe);

/* sheet */
let F=null,editId=null;
const WHEN=[{k:'today',n:'Сегодня',d:()=>TODAY()},{k:'tom',n:'Завтра',d:()=>addDays(1)},{k:'week',n:'Через неделю',d:()=>addDays(7)},{k:'none',n:'Без даты',d:()=>''}];
function openSheet(id){
  editId=id||null;
  const x=id?S.tasks.find(t=>t.id===id):null;
  F=x?JSON.parse(JSON.stringify(x)):{title:'',note:'',list:S.list!=='all'?S.list:'me',due:S.tab==='soon'?addDays(1):S.tab==='all'?'':TODAY(),time:'',prio:0,subs:[]};
  $('#shtitle').textContent=x?'Изменить':'Новая задача';
  $('#f-title').value=F.title;$('#f-note').value=F.note;$('#f-time').value=F.time;
  $('#del').style.display=x?'block':'none';
  sheetUI();autosize();
  $('#backdrop').classList.add('show');$('#sheet').classList.add('show');$('#fab').classList.add('open');
  history.pushState({sheet:1},'');
  if(!x)setTimeout(()=>$('#f-title').focus(),350);
  buzz(6);
}
function closeSheet(fromPop){
  $('#backdrop').classList.remove('show');$('#sheet').classList.remove('show');$('#fab').classList.remove('open');
  $('#sheet').style.transform='';document.activeElement&&document.activeElement.blur();
  if(!fromPop&&history.state&&history.state.sheet)history.back();
}
window.addEventListener('popstate',()=>{if($('#sheet').classList.contains('show'))closeSheet(true)});
window.onAndroidBack=()=>{if($('#sheet').classList.contains('show')){closeSheet();return true}return false};
function sheetUI(){
  const cur=WHEN.find(w=>w.d()===F.due);
  let wh=WHEN.map(w=>`<button class="opt ${cur&&cur.k===w.k?'on':''}" data-w="${w.k}">${w.n}</button>`).join('');
  const custom=F.due&&!cur;
  const cl=custom?dueLabel({due:F.due}).txt:'Дата…';
  wh+=`<label class="opt ${custom?'on':''}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>${cl}<input type="date" id="f-date" value="${F.due||''}"></label>`;
  $('#f-when').innerHTML=wh;
  $('#timeopt').classList.toggle('on',!!F.time);$('#timetxt').textContent=F.time||'Время';
  $('#f-list').innerHTML=LISTS.map(l=>`<button class="opt ${F.list===l.id?'on':''}" data-l="${l.id}" style="--c:${l.c}"><i></i>${l.name}</button>`).join('');
  const P=[{v:0,n:'Обычный',c:'#8E8E93'},{v:1,n:'Средний',c:'#FF9F0A'},{v:2,n:'Важно',c:'#FF3B30'}];
  $('#f-prio').innerHTML=P.map(p=>`<button class="opt ${F.prio===p.v?'on':''}" data-p="${p.v}" style="--c:${p.c}">${p.v?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>':''}${p.n}</button>`).join('');
  subsUI();
  $('#save').disabled=!$('#f-title').value.trim();
}
function subsUI(focusLast){
  $('#f-subs').innerHTML=F.subs.map((s,i)=>`<div class="sub" data-i="${i}"><button class="sc ${s.d?'on':''}"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button><input value="${esc(s.t)}" placeholder="Пункт"><button class="x">×</button></div>`).join('');
  if(focusLast){const ins=$('#f-subs').querySelectorAll('input');ins[ins.length-1]&&ins[ins.length-1].focus()}
}
$('#f-when').addEventListener('click',e=>{const b=e.target.closest('[data-w]');if(!b)return;F.due=WHEN.find(w=>w.k===b.dataset.w).d();if(!F.due)F.time='';buzz(5);sheetUI()});
$('#f-when').addEventListener('change',e=>{if(e.target.id==='f-date'){F.due=e.target.value;sheetUI()}});
$('#f-time').addEventListener('change',e=>{F.time=e.target.value;if(F.time&&!F.due)F.due=TODAY();sheetUI()});
$('#f-list').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b)return;F.list=b.dataset.l;buzz(5);sheetUI()});
$('#f-prio').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;F.prio=+b.dataset.p;buzz(5);sheetUI()});
$('#addsub').onclick=()=>{F.subs.push({t:'',d:false});subsUI(true)};
$('#f-subs').addEventListener('click',e=>{const r=e.target.closest('.sub');if(!r)return;const i=+r.dataset.i;
  if(e.target.closest('.sc')){F.subs[i].d=!F.subs[i].d;buzz(6);e.target.closest('.sc').classList.toggle('on')}
  if(e.target.closest('.x')){F.subs.splice(i,1);subsUI()}});
$('#f-subs').addEventListener('input',e=>{const r=e.target.closest('.sub');if(r)F.subs[+r.dataset.i].t=e.target.value});
$('#f-subs').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();F.subs.push({t:'',d:false});subsUI(true)}});
$('#f-title').addEventListener('input',()=>{$('#save').disabled=!$('#f-title').value.trim()});
$('#f-title').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#f-note').focus()}});
function autosize(){const t=$('#f-note');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,220)+'px'}
$('#f-note').addEventListener('input',autosize);
$('#save').onclick=()=>{
  const title=$('#f-title').value.trim();if(!title)return;
  F.title=title;F.note=$('#f-note').value.trim();F.subs=F.subs.filter(s=>s.t.trim());
  if(editId){const i=S.tasks.findIndex(t=>t.id===editId);S.tasks[i]={...S.tasks[i],...F}}
  else{S.tasks.push({...F,id:uid(),done:false,created:Date.now()})}
  save();buzz([8,40,12]);closeSheet();
  setTimeout(()=>render(),120);
  if(!editId){const t=TODAY();const tab=!F.due?'all':F.due<=t?'today':'soon';if(S.tab!=='all'&&S.tab!==tab){S.tab=tab;setTimeout(()=>render(true),140)}}
};
$('#del').onclick=()=>{const id=editId;closeSheet();setTimeout(()=>removeTask(id),250)};
$('#cancel').onclick=()=>closeSheet();
$('#backdrop').onclick=()=>closeSheet();
$('#fab').onclick=()=>$('#sheet').classList.contains('show')?closeSheet():openSheet();

/* drag sheet down to close */
(()=>{let y0=null,dy=0;const sh=$('#sheet');
  const start=e=>{if(sh.scrollTop>0&&e.target.id!=='grab')return;y0=e.touches[0].clientY;dy=0};
  sh.addEventListener('touchstart',e=>{if(e.target.closest('input,textarea,button,label')&&e.target.id!=='grab')return;start(e)},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0===null)return;dy=e.touches[0].clientY-y0;if(dy>0){sh.classList.add('drag');sh.style.transform=`translateY(${dy}px)`}},{passive:true});
  sh.addEventListener('touchend',()=>{if(y0===null)return;sh.classList.remove('drag');if(dy>110)closeSheet();else sh.style.transform='';y0=null});
})();

/* midnight refresh */
let lastDay=TODAY();setInterval(()=>{if(TODAY()!==lastDay){lastDay=TODAY();render(true)}},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
window.addEventListener('resize',segUI);

load();applyTheme();chips();render(true);
</script>
